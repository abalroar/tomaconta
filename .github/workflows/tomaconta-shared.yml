name: Atualização compartilhada Toma Conta

on:
  schedule:
    # Keep the five-minute cadence away from the start-of-hour queue peak.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'Enfileirar baseline inicial (somente sem revisão ativa)'
        type: boolean
        default: false
      diagnostic:
        description: 'Somente diagnóstico OIDC (sem chamada à API nem coleta)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: tomaconta-shared-main
  cancel-in-progress: false

jobs:
  pending:
    if: >-
      github.repository_id == '1141557164' &&
      github.repository_owner_id == '255978345' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.private == false &&
      (github.event_name == 'workflow_dispatch' || vars.TOMACONTA_SHARED_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pending: ${{ steps.pending.outputs.pending }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: scripts/tomaconta_shared_runner.py
      - id: pending
        env:
          BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap || false }}
          DIAGNOSTIC: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic || false }}
        run: |
          if [ "$DIAGNOSTIC" = "true" ]; then
            python scripts/tomaconta_shared_runner.py --identity-only
          elif [ "$BOOTSTRAP" = "true" ]; then
            python scripts/tomaconta_shared_runner.py --seed --pending-only
          else
            python scripts/tomaconta_shared_runner.py --pending-only
          fi

  execute:
    needs: pending
    if: needs.pending.outputs.pending == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            web/tools/requirements-network.txt
      - run: python -m pip install -r requirements.txt -r web/tools/requirements-network.txt
      # Claim only after installing: setup time never consumes a job's lease.
      - run: python scripts/tomaconta_shared_runner.py
